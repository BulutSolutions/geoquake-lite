[platformio]
; GeoQuake Lite: standalone open-source firmware.
default_envs = geoquake_lite

[env:geoquake_lite]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; --- MEMORY SETTINGS (S3R8 Chip) ---
board_build.arduino.memory_type = qio_opi
; The module boots unreliably with a QIO bootloader (ROM watchdog loop at
; ets_loader.c:78 after the first segment). DIO is the safe external-flash
; mode for both USB recovery and normal firmware execution.
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions/geoquake_lite_16MB.csv
board_build.filesystem = littlefs

; --- OPTIMIZATION: PSRAM/Flash Speed Configuration ---
; Explicit Flash frequency (conservative, safe)
board_upload.flash_freq = 80m

; PSRAM speed (conservative start - OPI mode)
; Starting at 80 MHz for stability, can test 120 MHz later if stable
board_build.f_psram = 80000000

; --- BUILD FLAGS ---
build_flags =
    -Iinclude
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- OPTIMIZATION FLAGS ---
    -O3                                     ; Aggressive optimization
    -ffunction-sections                     ; Each function in own section (for LTO)
    -fdata-sections                         ; Each data in own section (for LTO)
    -ffast-math                             ; Aggressive floating point optimizations
    -fno-finite-math-only                   ; keep isnan()/isinf() working under -ffast-math
    -funroll-loops                          ; Unroll loops for speed
    -finline-functions                      ; Aggressive inlining
    -finline-limit=800                      ; Increase inline limit
    -fno-exceptions                         ; Disable C++ exceptions (saves RAM)
    ; --- PHASE 2 OPTIMIZATION: Link-Time Optimization ---
    -flto                                   ; Enable link-time optimization
    ; --- LVGL 9.x CONFIG ---
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -D LV_CONF_SKIP
    -D LV_COLOR_DEPTH=16
    -D LV_DEF_REFR_PERIOD=16            ; display refresh + indev read timers (LVGL 9 default 33 ms
                                        ; caps the map at 30 FPS)
    -D LV_USE_STDLIB_STRING=LV_STDLIB_CLIB  ; lv_memcpy -> newlib memcpy: the builtin one copies
                                           ; mutually misaligned rows byte-by-byte through a
                                           ; volatile pointer (memw per byte) - every tile blit
                                           ; at an odd x position
    -D LV_ATTRIBUTE_MEM_ALIGN_SIZE=4    ; Force 4-byte alignment for PSRAM
    '-D LV_MEM_SIZE=(384*1024)'
    -D LV_MEM_POOL_INCLUDE=\"lvgl_mem.h\"
    -D LV_MEM_POOL_ALLOC=lvgl_pool_alloc
    -D LV_ATTRIBUTE_FAST_MEM_USE_IRAM=1  ; Place LVGL critical functions in IRAM
    -D LV_USE_IMAGE=1
    -D LV_USE_CANVAS=1
    ; --- ENABLE FONTS ---
    -D LV_FONT_UNSCII_8=1
    -D LV_FONT_MONTSERRAT_8=1
    -D LV_FONT_MONTSERRAT_10=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1              ; System Menu
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_20=1              ; System Menu
    -D LV_FONT_MONTSERRAT_24=1              ; System Menu (also used by the app)
    -D LV_FONT_MONTSERRAT_32=1
    -D LV_FONT_MONTSERRAT_48=1
    
; --- LIBRARIES ---
lib_deps =
    lvgl/lvgl @ 9.5.0
    ; FORCE version 1.4.9 (Stable) to fix the "esp32-hal-periman.h" error
    moononournation/GFX Library for Arduino @ 1.4.9
    bblanchon/ArduinoJson @ 7.4.2
    lewisxhe/XPowersLib @ 0.2.9
    lewisxhe/SensorLib @ 0.3.3
    ; Improv Wi-Fi over USB serial (browser installer / ESP Web Tools), pinned to a reviewed commit.
    https://github.com/improv-wifi/sdk-cpp.git#8e87b560bd5dd7de296847538ea11edb70401d65

; --- LINKER FLAGS (LTO + Dead Code Elimination) ---
build_unflags =
    -Os                                     ; Remove default -Os
    -O2                                     ; Remove default -O2
    -fno-lto                                ; Remove any LTO disablement

extra_scripts =

build_type = release

monitor_speed = 115200

; --- UPLOAD SETTINGS ---
; Uncomment and set the correct port after connecting ESP32-S3
; upload_port = /dev/cu.usbmodem*

[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
build_flags =
    -std=c++17
    -Iinclude
    -D GQ_PROJECT_DIR=\"${PROJECT_DIR}\"
test_build_src = true
build_src_filter =
    +<map_mercator.cpp>
    +<map_projection.cpp>
    +<usgs_parse.cpp>